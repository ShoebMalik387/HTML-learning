<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script Arithmetic Operator</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        let x=5;
        let y=7;
        let z=x+y;
        document.getElementById("demo").innerHTML=z;
    </script>
</body>
</html>

<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

</head>
<body>
    <p id="demo"></p>
