<html lang="en">
<head>

    <title>Table Tag</title>
</head>

    </tr>

        <th colspan="3">Marks Details</th>
    </tr>

        <th>Java</th>
    </tr>
    <tr>
        <td>85</td>

    </tr>

</table>

</body>
</html>
